spring:
  application:
    name: order-management

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orderdb}
    username: ${DB_USERNAME:orderuser}
    password: ${DB_PASSWORD:orderpass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  # IBM MQ connection — values come from environment variables
  ibm:
    mq:
      queue-manager: ${MQ_QUEUE_MANAGER:QM1}
      channel: ${MQ_CHANNEL:DEV.APP.SVRCONN}
      conn-name: ${MQ_CONN_NAME:localhost(1414)}
      user: ${MQ_USER:app}
      password: ${MQ_PASSWORD:}

  # Keycloak acts as the OAuth2/OIDC issuer
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/orders-realm}

external:
  pricing-service:
    base-url: ${PRICING_SERVICE_URL:http://pricing-service:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
