# Persistence-slice test profile — real PostgreSQL, Liquibase-owned schema, no web/MQ.
spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5433/orderdb_test}
    username: ${TEST_DB_USER:orderuser}
    password: ${TEST_DB_PASS:orderpass}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml   # changelogs live in this module's main resources
