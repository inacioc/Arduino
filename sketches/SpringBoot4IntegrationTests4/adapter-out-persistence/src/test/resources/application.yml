# Persistence-slice test profile — real PostgreSQL, Flyway-owned schema, no web/MQ.
spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5433/orderdb_test}
    username: ${TEST_DB_USER:orderuser}
    password: ${TEST_DB_PASS:orderpass}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration   # migrations live in this module's main resources
    clean-disabled: false
