spring:
  application:
    name: order-batch

  datasource:
    url: jdbc:postgresql://localhost:5432/orderdb
    username: orderuser
    password: orderpass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration   # from the persistence module on the classpath
    baseline-on-migrate: true

  batch:
    jdbc:
      initialize-schema: always   # auto-create batch metadata tables
    job:
      enabled: false              # the job is launched explicitly, not on startup

# Only read when the app is started with --spring.profiles.active=scheduler
# (see SchedulingConfig / OrderConfirmationRequestPoller).
app:
  batch:
    scheduler:
      output-dir: ./batch-output
      fixed-rate-ms: 60000
