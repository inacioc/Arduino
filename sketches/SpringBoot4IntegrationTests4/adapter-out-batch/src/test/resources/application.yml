# Batch-slice test profile — real PostgreSQL for domain data + batch metadata, no web/MQ.
spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5433/orderdb_test}
    username: ${TEST_DB_USER:orderuser}
    password: ${TEST_DB_PASS:orderpass}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml   # from the persistence module on the test classpath
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false
