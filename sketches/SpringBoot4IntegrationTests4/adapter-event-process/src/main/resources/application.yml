spring:
  application:
    name: order-event-process

  datasource:
    url: jdbc:postgresql://localhost:5432/orderdb
    username: orderuser
    password: orderpass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate        # Modulith owns event_publication's schema via its own Flyway migration
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration   # empty here on purpose; Modulith contributes its own migration
    baseline-on-migrate: true

app:
  event-process:
    enabled: true            # ModulithEventLogger (DB polling, cross-process, read-only)
    fixed-rate-ms: 15000
    listener:
      enabled: true          # ApplicationEventLogger (@ApplicationModuleListener, same-process only)
