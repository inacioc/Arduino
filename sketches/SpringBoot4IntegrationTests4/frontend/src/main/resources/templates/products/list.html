<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head><title>Products</title></head>
<body>
<div layout:fragment="content">
    <div class="page-header">
        <h1>Products</h1>
        <a class="btn" th:href="@{/products/new}">New product</a>
    </div>
    <table class="data-table">
        <thead>
        <tr><th>Name</th><th>Price</th><th>Available</th></tr>
        </thead>
        <tbody>
        <tr th:each="product : ${products}">
            <td th:text="${product.name()}"></td>
            <td th:text="${'$' + product.price()}"></td>
            <td>
                <span th:if="${product.available()}" class="badge badge-ok">Yes</span>
                <span th:unless="${product.available()}" class="badge badge-off">No</span>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(products)}">
            <td colspan="3">No products yet.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
