<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head><title>Orders</title></head>
<body>
<div layout:fragment="content">
    <div class="page-header">
        <h1>Orders</h1>
        <a class="btn" th:href="@{/orders/new}">New order</a>
    </div>

    <form th:action="@{/orders}" method="get" class="filter-form">
        <label for="status">Status</label>
        <select id="status" name="status" onchange="this.form.submit()">
            <option value="">All</option>
            <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                    th:selected="${s == selectedStatus}"></option>
        </select>
    </form>

    <table class="data-table">
        <thead>
        <tr><th>Customer</th><th>Status</th><th>Total</th><th>Created</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="order : ${orders}">
            <td th:text="${order.customerId()}"></td>
            <td><span class="badge" th:text="${order.status()}"></span></td>
            <td th:text="${'$' + order.totalAmount()}"></td>
            <td th:text="${#temporals.format(order.createdAt(), 'yyyy-MM-dd HH:mm')}"></td>
            <td><a th:href="@{/orders/{id}(id=${order.id()})}">View</a></td>
        </tr>
        <tr th:if="${#lists.isEmpty(orders)}">
            <td colspan="5">No orders found.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
