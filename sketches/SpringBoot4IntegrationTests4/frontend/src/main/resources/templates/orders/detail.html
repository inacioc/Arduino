<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head><title>Order detail</title></head>
<body>
<div layout:fragment="content">
    <h1>Order <span th:text="${order.id()}"></span></h1>
    <p>Customer: <strong th:text="${order.customerId()}"></strong></p>
    <p>Status: <span class="badge" th:text="${order.status()}"></span></p>
    <p>Total: <strong th:text="${'$' + order.totalAmount()}"></strong></p>

    <table class="data-table">
        <thead>
        <tr><th>Product</th><th>Quantity</th><th>Unit price</th><th>Subtotal</th></tr>
        </thead>
        <tbody>
        <tr th:each="item : ${order.items()}">
            <td th:text="${item.productName()}"></td>
            <td th:text="${item.quantity()}"></td>
            <td th:text="${'$' + item.unitPrice()}"></td>
            <td th:text="${'$' + item.subtotal()}"></td>
        </tr>
        </tbody>
    </table>

    <div class="form-actions">
        <form th:if="${order.status().name() == 'PENDING'}"
              th:action="@{/orders/{id}/confirm(id=${order.id()})}" method="post" style="display:inline">
            <input type="hidden" name="_method" value="put"/>
            <button type="submit" class="btn">Confirm</button>
        </form>
        <form th:if="${order.status().name() == 'CONFIRMED' or order.status().name() == 'PROCESSING'}"
              th:action="@{/orders/{id}/complete(id=${order.id()})}" method="post" style="display:inline">
            <input type="hidden" name="_method" value="put"/>
            <button type="submit" class="btn">Complete</button>
        </form>
        <form th:if="${order.status().name() == 'PENDING' or order.status().name() == 'CONFIRMED'}"
              th:action="@{/orders/{id}/cancel(id=${order.id()})}" method="post" style="display:inline">
            <input type="hidden" name="_method" value="put"/>
            <button type="submit" class="btn btn-secondary">Cancel</button>
        </form>
        <a class="btn btn-secondary" th:href="@{/orders}">Back to orders</a>
    </div>
</div>
</body>
</html>
